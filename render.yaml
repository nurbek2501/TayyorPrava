# Prava Pro (TayyorPrava) — Render Blueprint
# Render dashboard'da: New + -> Blueprint -> shu reponi tanlang.
# Backend (FastAPI, Docker) + Frontend (Vite static) bir blueprint'da.
#
# ✅ Ma'lumotlar bazasi: PostgreSQL.
#   Birinchi deploy'da backend bo'sh Postgres'ni image ichidagi app.db'dan avtomatik
#   to'ldiradi (app/db/bootstrap.py) — admin, savollar, mavzular, promokodlar hammasi ko'chadi.
#   Restart/redeploy'da saqlanadi. (Free plan muddati haqida pastdagi ⚠️ ga qarang.)

databases:
  - name: tayyorprava-db
    # Frankfurt — O'zbekistonga eng yaqin Render regioni (baza+backend+bot bir xil bo'lishi shart).
    region: frankfurt
    plan: free
    # ⚠️ Free Postgres 30 kundan keyin muddati tugaydi (+14 kun ichida upgrade
    #   qilinmasa MA'LUMOT BILAN O'CHIRILADI). Hozircha tekin, keyin pulliga o'tamiz.
    #   Bo'sh bazani backend app.db'dan avtomatik to'ldiradi (bootstrap.py).
    databaseName: tayyorprava
    user: tayyorprava

services:
  # ---- Backend API (FastAPI, Docker) ----
  - type: web
    name: tayyorprava
    runtime: docker
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render $PORT beradi — Dockerfile'dagi qat'iy 8000 o'rniga shuni ishlatamiz.
    # Render buyruqni O'ZI `sh -c` bilan ishga tushiradi — qo'shimcha `sh -c "..."`
    # o'rash mumkin emas (butun matn bitta buyruq nomi bo'lib qoladi -> exit 127).
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Free — 15 daqiqa harakatsizlikdan keyin uxlaydi (birinchi so'rov ~1 daqiqa kutadi).
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEBUG
        value: "False"
      # Kuchli tasodifiy SECRET_KEY — Render generatsiya qiladi (JWT imzosi uchun).
      - key: SECRET_KEY
        generateValue: true
      # PostgreSQL — Render bazasidan avtomatik olinadi. Ilova `postgres://` ni
      # `postgresql+asyncpg://` ga o'zi normallashtiradi (config.py).
      - key: DATABASE_URL
        fromDatabase:
          name: tayyorprava-db
          property: connectionString
      # Frontend static site URL'i (pastdagi xizmat nomiga mos).
      - key: CORS_ORIGINS
        value: https://tayyorprava-web.onrender.com
      - key: RATE_LIMIT_ENABLED
        value: "True"
      # Kod berish endpointi va webhook uchun maxfiy kalit — Render generatsiya qiladi.
      - key: BOT_SHARED_SECRET
        generateValue: true
      # ---- Telegram bot (webhook rejimi — backend ICHIDA ishlaydi) ----
      # Render free planda worker yo'q, shuning uchun bot alohida xizmat emas:
      # backend ishga tushganda Telegram webhook'ini o'zi o'rnatadi
      # (app/services/telegram_bot.py). Pullik planga qaytilganda: BOT_TOKEN'ni
      # bu yerdan olib tashlab, telegram_bot/ worker'ini qayta qo'shish kifoya.
      # ⚠️ MAXFIY — @BotFather'dan olgan tokenni Render dashboard'da qo'lda kiriting.
      #   (Ochiq ko'rilgan bo'lsa avval /revoke qilib yangisini oling.)
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL
        value: "@TayyorPrava"
      - key: CHANNEL_URL
        value: https://t.me/TayyorPrava

  # ---- Frontend (Vite static site) ----
  # Render'da statik sayt bepul (100 GB/oy trafik). API manzili .env.production'da ham bor.
  - type: web
    name: tayyorprava-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://tayyorprava.onrender.com/api
    routes:
      # SPA — barcha yo'llar index.html'ga (React Router uchun).
      - type: rewrite
        source: /*
        destination: /index.html
